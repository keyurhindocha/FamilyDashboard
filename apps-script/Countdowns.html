<!DOCTYPE html>
<html lang="en-CA">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;500;600&display=swap">
<style>
  :root { --bg: #1C1A2E; --panel: #24213A; --line: #4A4466; --text: #F3E9D2; --muted: #A9A2C6; --gold: #C9B37E; --parch: #F1E6CC; --ink: #2A2118; --red: #E8907F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'EB Garamond', Georgia, serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 24px; letter-spacing: .04em; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 17px; }
  .label { font-family: Cinzel, serif; letter-spacing: .22em; color: var(--gold); font-size: 12px; margin: 26px 0 10px; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 15px; color: var(--muted); margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=date] { width: 100%; font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #15132A; color: var(--text); -webkit-appearance: none; appearance: none; min-height: 46px; }
  input::placeholder { color: #6E6890; }
  .emojis { display: flex; flex-wrap: wrap; gap: 6px; }
  .emojis button { font-size: 24px; width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: #15132A; cursor: pointer; line-height: 1; }
  .emojis button.on { border-color: var(--gold); background: #3A3456; box-shadow: 0 0 0 2px var(--gold) inset; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { font: inherit; font-size: 18px; padding: 10px 20px; border-radius: 10px; border: 0; cursor: pointer; min-height: 46px; }
  .primary { background: var(--gold); color: var(--bg); font-weight: 600; flex: 1; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .msg { min-height: 22px; margin-top: 10px; font-size: 16px; color: var(--red); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--parch); color: var(--ink); }
  li.past { opacity: .5; }
  li .em { font-size: 30px; width: 40px; text-align: center; flex: none; }
  li .main { flex: 1; min-width: 0; }
  li .t { font-size: 19px; font-weight: 500; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .d { font-size: 15px; color: #5C4A33; }
  li .n { font-family: Cinzel, serif; font-size: 15px; text-align: right; flex: none; color: #5C4A33; }
  li .n b { display: block; font-size: 24px; color: var(--ink); line-height: 1; }
  li .tools { display: flex; flex-direction: column; gap: 4px; flex: none; }
  li .tools button { font: inherit; font-size: 14px; padding: 4px 10px; border-radius: 8px; border: 1px solid #C9B98F; background: transparent; color: #5C4A33; cursor: pointer; }
  .empty { color: var(--muted); font-style: italic; font-size: 17px; }
</style>
</head>
<body>
<main>
  <h1>Looking forward to</h1>
  <p class="sub">Add things the kids are excited about. The kitchen board counts down the sleeps.</p>

  <form id="f" autocomplete="off">
    <label for="title">What is it?</label>
    <input id="title" type="text" maxlength="60" placeholder="Florida vacation, sleepover at Maya's…">
    <label for="date">When?</label>
    <input id="date" type="date">
    <label for="who">Who's it for? <span style="opacity:.7">(optional)</span></label>
    <input id="who" type="text" maxlength="40" placeholder="Everyone">
    <label>Pick a picture</label>
    <div id="emojis" class="emojis"></div>
    <div class="actions">
      <button id="save" class="btn primary" type="submit">Add countdown</button>
      <button id="cancel" class="btn ghost" type="button" style="display:none">Cancel</button>
    </div>
    <div id="msg" class="msg" role="status"></div>
  </form>

  <div class="label">COMING UP</div>
  <ul id="list"><li class="empty" style="background:none">Loading…</li></ul>
</main>

<script>
var KEY = '<?= boardKey ?>';
var EMOJIS = ['🏖️', '✈️', '🏕️', '🛌', '🎂', '🎉', '🎢', '🎄', '🎆', '🎁', '⚽', '🏊', '🎬', '🎨', '🐶', '🍕', '⛄', '🎃', '🏒', '🚗'];
var editing = null, picked = EMOJIS[0], items = [];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function todayIso() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function sleeps(iso) {
  var a = todayIso().split('-'), b = iso.split('-');
  return Math.round((Date.UTC(+b[0], +b[1] - 1, +b[2]) - Date.UTC(+a[0], +a[1] - 1, +a[2])) / 864e5);
}
function nice(iso) {
  var p = iso.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-CA', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function drawEmojis() {
  $('emojis').innerHTML = EMOJIS.map(function (e) {
    return '<button type="button" class="' + (e === picked ? 'on' : '') + '" data-e="' + e + '" aria-label="' + e + '">' + e + '</button>';
  }).join('');
}
$('emojis').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  picked = b.getAttribute('data-e'); drawEmojis();
});

function draw(list) {
  items = list || [];
  if (!items.length) { $('list').innerHTML = '<li class="empty" style="background:none">Nothing yet. Add the next big thing above.</li>'; return; }
  $('list').innerHTML = items.map(function (c) {
    var n = sleeps(c.date), past = n < 0;
    var count = past ? 'done' : n === 0 ? '<b>Today!</b>' : '<b>' + n + '</b>' + (n === 1 ? 'sleep' : 'sleeps');
    return '<li class="' + (past ? 'past' : '') + '"><span class="em">' + esc(c.emoji) + '</span>' +
      '<div class="main"><div class="t">' + esc(c.title) + '</div><div class="d">' + esc(nice(c.date)) + (c.who ? ' · ' + esc(c.who) : '') + '</div></div>' +
      '<div class="n">' + count + '</div>' +
      '<div class="tools"><button type="button" data-edit="' + esc(c.id) + '">Edit</button><button type="button" data-del="' + esc(c.id) + '">Delete</button></div></li>';
  }).join('');
}
$('list').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  var id = b.getAttribute('data-edit') || b.getAttribute('data-del');
  var c = items.filter(function (x) { return x.id === id; })[0]; if (!c) return;
  if (b.getAttribute('data-edit')) {
    editing = c.id; $('title').value = c.title; $('date').value = c.date; $('who').value = c.who || '';
    picked = c.emoji; drawEmojis(); $('save').textContent = 'Save changes'; $('cancel').style.display = '';
    $('f').scrollIntoView({ behavior: 'smooth' });
  } else if (confirm('Delete "' + c.title + '"?')) {
    google.script.run.withSuccessHandler(draw).withFailureHandler(fail).deleteCountdown(KEY, c.id);
  }
});

function reset() {
  editing = null; $('f').reset(); picked = EMOJIS[0]; drawEmojis();
  $('save').textContent = 'Add countdown'; $('cancel').style.display = 'none'; $('msg').textContent = '';
}
function fail(err) { $('msg').textContent = (err && err.message) || String(err); $('save').disabled = false; }

$('cancel').addEventListener('click', reset);
$('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var item = { id: editing, title: $('title').value, date: $('date').value, who: $('who').value, emoji: picked };
  if (!item.title.trim()) return fail('Give it a name first.');
  if (!item.date) return fail('Pick a date.');
  $('save').disabled = true; $('msg').textContent = '';
  google.script.run.withSuccessHandler(function (list) { $('save').disabled = false; draw(list); reset(); })
    .withFailureHandler(fail).saveCountdown(KEY, item);
});

drawEmojis();
google.script.run.withSuccessHandler(draw).withFailureHandler(fail).listCountdowns(KEY);
</script>
</body>
</html>
